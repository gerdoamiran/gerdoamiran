<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>گردو امیران | خرید گردوی تویسرکان</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#f7f6f2;
color:#333;
}

header{
background:#2e5d32;
color:white;
padding:18px;
position:sticky;
top:0;
z-index:1000;
}

header h1{
font-size:28px;
text-align:center;
}

.hero{
padding:60px 20px;
text-align:center;
background:linear-gradient(135deg,#2e5d32,#6f4e37);
color:white;
}

.hero h2{
font-size:34px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
line-height:2;
max-width:700px;
margin:auto;
}

.btn{
display:inline-block;
margin-top:30px;
padding:15px 35px;
background:#d4af37;
color:#222;
font-weight:bold;
text-decoration:none;
border-radius:50px;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
}

section{
padding:60px 20px;
max-width:1200px;
margin:auto;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
border-radius:15px;
padding:25px;
box-shadow:0 10px 20px rgba(0,0,0,.08);
text-align:center;
}

.card h3{
margin-bottom:10px;
color:#2e5d32;
}

footer{
background:#2e5d32;
color:white;
padding:35px;
text-align:center;
margin-top:50px;
}

</style>

</head>

<body>

<header>

<h1>🌰 گردو امیران</h1>

</header>

<div class="hero">

<h2>خرید مستقیم گردوی اصل تویسرکان</h2>

<p>

از باغ تا خانه شما
بدون واسطه
تضمین کیفیت
ارسال به سراسر ایران

</p>

<a class="btn" href="https://wa.me/">ثبت سفارش</a>

</div>

<section>

<h2 style="text-align:center;margin-bottom:40px;">
چرا گردو امیران؟
</h2>

<div class="cards">

<div class="card">
<h3>تازه و امسالی</h3>
<p>کاملاً تازه و دستچین شده</p>
</div>

<div class="card">
<h3>ارسال سریع</h3>
<p>ارسال به سراسر کشور</p>
</div>

<div class="card">
<h3>تضمین کیفیت</h3>
<p>ضمانت رضایت مشتری</p>
</div>

</div>

</section>

<footer>

تمام حقوق متعلق به گردو امیران است.

</footer>

</body>
</html>
